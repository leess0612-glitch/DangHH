<!--
  유튜브 전용 짧은 주소 (2026-11-25) — 유튜브 채널·영상 설명란에는 이 짧은 주소만 쓴다.
  누르면 꼬리표(utm)를 붙인 주소로 바로 넘긴다. 이 화면 자체는 통계에 세지 않는다.
  영상마다 나누어 보려면 주소 끝에 ?c=영상이름 을 붙인다. 예) danghh.com/yt?c=정수기v7
  ?c= 가 없으면 「채널」로 센다.
-->
<script>
(function(){
  var c = '';
  try { c = new URLSearchParams(location.search).get('c') || ''; } catch (e) {}
  c = c.replace(/[^0-9A-Za-z가-힣_\-]/g, '').slice(0, 40) || '채널';
  location.replace('https://danghh.com/%EC%B9%B4%ED%86%A1.html?%EC%B6%9C%EC%B2%98=' + encodeURIComponent('유튜브-' + c));
})();
</script>
