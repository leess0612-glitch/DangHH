<meta charset="utf-8">

<title>카카오톡 상담 | 당현함</title>
<meta name="description" content="당현함 카카오톡 상담 바로가기">
<link rel="canonical" href="https://danghh.com/yt/kakao/">
<meta property="og:title" content="당현함 — 인터넷 가입·정수기 렌탈 비교 플랫폼">
<meta property="og:description" content="당신의 현명한 렌탈, 함께 비교합니다">
<meta property="og:url" content="https://danghh.com/yt/kakao/">
<meta property="og:image" content="https://danghh.com/images/share-main.png">
<!--
  유튜브 전용 짧은 주소 (2026-11-25) — 유튜브 채널·영상 설명란에는 이 짧은 주소만 쓴다.
  누르면 꼬리표(utm)를 붙인 주소로 바로 넘긴다. 이 화면 자체는 통계에 세지 않는다.
  영상마다 나누어 보려면 주소 끝에 ?c=영상이름 을 붙인다. 예) danghh.com/yt?c=정수기v7
  ?c= 가 없으면 「채널」로 센다.
-->
<script>
(function(){
  var c = '';
  try { c = new URLSearchParams(location.search).get('c') || ''; } catch (e) {}
  c = c.replace(/[^0-9A-Za-z가-힣_\-]/g, '').slice(0, 40) || '채널';
  /* 당현함 SNS 통계 창고(관리자 화면 「당현함」 탭)에도 「유튜브 → 카톡 누름」 한 줄 — 사이트 안 카톡 단추(dh-track.js)와 같은 모양.
     로봇·?test 는 보내지 않고, 실패해도 이동은 막지 않는다. */
  try {
    if (navigator.webdriver !== true && !/[?&]test/.test(location.search) && !sessionStorage.getItem('dh_sns_test')) {
      var 새표 = function(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2, 12)); };
      var u = localStorage.getItem('dh_uid'); if (!u) { u = 새표(); localStorage.setItem('dh_uid', u); }
      var 몸 = JSON.stringify({ k: 'click', m: 'kakao', s: 'youtube', md: '', c: '유튜브', ct: c, u: u, v: 새표(), p: 'yt-kakao' });
      if (!(navigator.sendBeacon && navigator.sendBeacon('https://danghh-sns-stats.danghh.workers.dev/e', 몸)))
        fetch('https://danghh-sns-stats.danghh.workers.dev/e', { method: 'POST', body: 몸, keepalive: true, mode: 'no-cors' });
    }
  } catch (e) {}
  location.replace('https://danghh.com/%EC%B9%B4%ED%86%A1.html?%EC%B6%9C%EC%B2%98=' + encodeURIComponent('유튜브-' + c));
})();
</script>
