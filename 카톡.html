<!--
  카카오톡 상담 경유 화면  (꼬리표 방식 · 파일 하나로 모든 자리를 담당)

  쓰는 법 — 주소 끝 ?출처= 에 어느 카페 글인지 적는다
    /카톡.html?출처=인터넷-156045      (156045 인터넷)
    /카톡.html?출처=인터넷-154965      (154965 인터넷, 지금 광고 없음)
    /카톡.html?출처=렌탈-156091        (156091 렌탈 현금성)
    /카톡.html?출처=코웨이-156092      (156092 코웨이)
    /카톡.html?출처=통합렌탈-145799    (145799 통합, 렌탈만)
    /카톡.html?출처=통합-126190        (126190 통합, 인터넷+렌탈)

  ★새 카페 글이 생기면 그 글에 ?출처=인터넷-157xxx 만 붙이면 된다.
    이 파일은 고칠 필요가 없다. 꼬리표를 그대로 구글에 넘기기 때문이다.
    글 번호를 쓰는 이유: 광고비 표와 클릭 표를 이어 붙이는 열쇠가 된다.
    '파워컨텐츠-인터넷' 같은 역할 이름은 글을 갈아치우면 두 글이 섞여 못 나눈다.

  왜 있나
    네이버 카페 글에는 우리 코드를 한 줄도 못 넣는다(네이버 땅이다).
    그래서 카톡 버튼이 몇 번 눌리는지 볼 방법이 없다.
    이 화면을 0.5초 거치게 해서 눌렸다는 것만 기록하고 카카오톡으로 넘긴다.
    ※ 우리 홈페이지 안의 카톡 버튼은 이 화면이 필요 없다.
      거기는 클릭을 지켜보는 코드가 이미 심어져 있다(index.html 의 dhTrack).

  주의
    - 방문으로는 세지 않는다(send_page_view:false).
      세면 홈페이지 참여율·평균시간 지표가 통째로 망가진다.
    - 구글에서 출처를 맞춤 측정기준으로 등록해야 글별로 갈려 보인다.
    - 색·글씨 값의 원본은 당현함 디자인보드의 dh-tokens.css 다.
-->

<style>
  :root{
    color-scheme: light;                 /* 손님 기기가 어둠모드여도 이 화면은 밝게 */
    --c-page:#F5F6F8;  --c-card:#FFFFFF; --c-line:#EEEFF3;
    --c-title:#191F28; --c-body:#333D4B; --c-sub:#5F6672;
    --c-kakao:#FEE500;
    --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,
           system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--font); color:var(--c-body);
    background:var(--c-page); letter-spacing:-.01em; word-break:keep-all;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .card{
    width:100%; max-width:340px; background:var(--c-card);
    border:1px solid var(--c-line); border-radius:12px;
    padding:28px 20px 20px; text-align:center;
    display:flex; flex-direction:column; gap:8px;
  }
  h1{
    margin:0; font-size:19px; line-height:26px; font-weight:800;
    color:var(--c-title); text-wrap:balance;
  }
  p{margin:0; font-size:13px; line-height:18px; font-weight:600; color:var(--c-sub)}
  .btn{
    margin-top:12px; display:flex; align-items:center; justify-content:center;
    min-height:48px; border-radius:8px; text-decoration:none;
    background:var(--c-kakao); color:#191F28;
    font-size:16px; line-height:22px; font-weight:700;
  }
  /* 2026-09-07 남의 브랜드색(카톡 노랑)은 어둡게 만들지 않는다. 눌림은 움직임으로. */
.btn{transition:transform .08s ease, box-shadow .08s ease}
.btn:hover{box-shadow:0 2px 6px rgba(0,0,0,.16)}
.btn:active{transform:translateY(1px) scale(.985); box-shadow:none}
  .btn:focus-visible{outline:3px solid #1257C9; outline-offset:2px}
  .dots{display:flex; gap:6px; justify-content:center; margin-top:4px; height:8px}
  .dots i{
    width:6px; height:6px; border-radius:999px; background:#8A9099;
    animation:blink 1.2s infinite ease-in-out;
  }
  .dots i:nth-child(2){animation-delay:.2s}
  .dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  @media (prefers-reduced-motion:reduce){ .dots i{animation:none; opacity:.5} }
</style>
</head>
<body>

<main class="card">
  <h1>카카오톡으로 이동합니다</h1>
  <p>잠시만 기다려 주세요</p>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <a class="btn" href="https://pf.kakao.com/_yxgTAs/chat">카카오톡 열기</a>
  <p>화면이 그대로면 위 단추를 눌러 주세요</p>
</main>

<script>
(function(){
  var 도착 = 'https://pf.kakao.com/_yxgTAs/chat';

  /* ── 꼬리표 읽기 ────────────────────────────────────────────
     주소의 ?출처= 값을 그대로 기록한다. 파일에 등록할 필요가 없다.
     새 카페 글이 생기면 그 글에 ?출처=인터넷-157xxx 를 붙이기만 하면
     대시보드가 알아서 새 줄로 잡는다. 이 파일은 손대지 않는다. */
  var 꼬리표 = '';
  try{ 꼬리표 = (new URLSearchParams(location.search).get('출처') || '').trim(); }catch(e){}

  /* 2026-09-07: 옛 꼬리표를 새 이름으로 바꿔 주던 표를 지웠다.
     카페 글의 꼬리표를 모두 '종류-글번호' 규칙으로 고쳐 넣어 예외가 없어졌다.
     ★규칙: 파워컨텐츠로 쓰는 글은 앞에 '파워' 를 붙인다.
       파워인터넷-156045 · 파워인터넷-154965 · 파워렌탈-156091 · 파워코웨이-156092
       상세·통합 글은 그대로 — SK-139009 · 코웨이-151741 · 통합-126190 ...
     '파워'는 광고가 켜졌나 꺼졌나가 아니라 그 글을 무슨 용도로 썼나를 뜻한다.
     그래서 광고를 꺼도(154965 처럼) 이름이 안 틀어진다. */
  if (!꼬리표) 꼬리표 = '(없음)';
  if (꼬리표.length > 90) 꼬리표 = 꼬리표.slice(0, 90);   /* 구글은 100자까지 받는다 */

  var 갔나 = false;
  function 가기(){
    if (갔나) return;
    /* 점검용: 주소 끝에 #멈춤 을 붙이면 기록만 하고 넘어가지 않는다.
       손님은 이 주소를 쓸 일이 없다. 우리가 확인할 때만 쓴다 */
    var 표시 = '';
    try{ 표시 = decodeURIComponent(location.hash || ''); }catch(e){ 표시 = location.hash || ''; }
    if (표시 === '#멈춤') return;   /* 크롬은 한글을 암호처럼 바꿔 두므로 되돌려서 비교한다 */
    갔나 = true;
    /* replace 를 쓴다 — 뒤로가기를 눌렀을 때 이 화면이 다시 뜨지 않도록 */
    location.replace(도착);
  }

  try{
    gtag('event', 'cafe_kakao_click', {
      dh_from: 꼬리표,
      event_callback: 가기,
      event_timeout: 700
    });
  }catch(e){ /* 기록이 실패해도 이동은 절대 막지 않는다 */ }

  /* 기록이 늦거나 막혀도 0.8초 뒤에는 무조건 넘어간다 */
  setTimeout(가기, 800);
})();
</script>
<style>
/* ===== 한글은 낱말 가운데를 끊지 않는다 (2026-09-11, 보드 규칙 9) =====
   왜: 좁은 폰에서 '상담까 / 지' 처럼 낱말이 두 줄로 갈라진다.
   범위: 글이 들어가는 곳만. 주소·코드처럼 끊어야 하는 것은 뺀다.
   ⚠ 표 안에 문장을 넣을 때는 white-space:normal 을 함께 줘야 한다 —
     안 그러면 표가 옆으로 한없이 늘어난다. */
body, p, li, dd, dt, h1, h2, h3, h4, span, strong, em, b, a, div, label, button, td, th, figcaption, blockquote {
  word-break: keep-all;
}
</style>
<style>
/* ===== 누르는 자리 44 (2026-09-11, 보드 규칙 9) =====
   보이는 크기는 그대로 두고 그 위에 보이지 않는 44짜리 층만 덮는다.
   층은 자리를 차지하지 않으므로 카드 높이도 발바닥 높이도 안 변한다.
   ⚠ 층이 옆 부품 위로 넘어가면 그쪽 누름을 가로챈다. 나란히 붙은 자리는 재고 덮었다. */
.더읽기, .logo, .hamburger, .rolling-more, .footer-links a, .doc-back { position: relative; }
.더읽기::after, .logo::after, .hamburger::after, .rolling-more::after,
.footer-links a::after, .doc-back::after {
  content: ""; position: absolute; left: 0; right: 0; top: 50%;
  transform: translateY(-50%); height: 44px;
}
/* 가로도 좁은 것은 44로 넓힌다 */
.더읽기::after, .hamburger::after {
  left: 50%; right: auto; width: 44px; min-width: 100%;
  transform: translate(-50%, -50%);
}
</style>
</body>
</html>
